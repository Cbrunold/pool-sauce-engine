[project]
name = "poolsauce"
version = "0.0.1"
description = "Pool Sauce — physics-grounded shot intelligence. Rō."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poolsauce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
