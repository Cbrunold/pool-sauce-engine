[project]
name = "poolsauce"
version = "0.0.1"
description = "Pool Sauce — physics-grounded shot intelligence. Rō."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.9",
  "pydantic>=2.6",
]

[project.scripts]
poolsauce = "poolsauce.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poolsauce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
